services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      # Link to connect the API to database
      - DBURL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/fcdk_db
      # You should indicate in which environement the project is (ex: Development, Test, Production etc.)
      - ENVIRONMENT=${ENVIRONMENT}
    # The API shouldn't be public in production. You shouldn't allow port forwarding
    #ports:
    #  - 127.0.0.1:8090:8090
    networks:
      - external-fcdk
      - internal
    restart: unless-stopped

  api_gateway:
    image: nginx:1.31.6-alpine-slim
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8085:80
    networks:
      - internal
    restart: unless-stopped
networks:
  internal:
  external-fcdk:
    external: true