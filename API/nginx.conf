# Rate limit zone: track requests per client IP.
# 10m = ~160,000 tracked IPs, plenty for a small deployment.
# rate=10r/s = 10 requests per second per IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location / {
        # burst=20: allow short bursts above the steady rate (queues extra requests instead of rejecting them immediately)
        # before nodelay kicks in.
        # nodelay: don't artificially delay queued requests, just enforce the cap.
        limit_req zone=api_limit burst=20 nodelay;

        # Return 429 (Too Many Requests) instead of nginx's default 503 when limited.
        limit_req_status 429;

        proxy_pass http://api:8090;

        # Pass along real client info to the upstream API.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}